<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIDA Achievement Record</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f8fc;
font-family:Inter,sans-serif;
padding:60px 20px;
}

.card{
background:white;
padding:50px;
border-radius:30px;
max-width:1000px;
margin:auto;
box-shadow:0 15px 50px rgba(0,0,0,0.08);
}

h1{
font-weight:800;
color:#16324f;
margin-bottom:15px;
}

.section{
margin-top:40px;
}

.section-title{
font-size:1.5rem;
font-weight:800;
color:#d62839;
margin-bottom:20px;
}

.content-box{
background:#f8fbff;
padding:25px;
border-radius:20px;
white-space:pre-line;
line-height:2;
}

.btn-kida{
display:inline-block;
margin-top:35px;
background:#d62839;
padding:16px 28px;
border-radius:999px;
font-weight:700;
color:white;
text-decoration:none;
}

.btn-kida:hover{
background:#b71f2e;
color:white;
}

/* MOBILE RESPONSIVE */

@media(max-width:768px){

body{
padding:30px 15px;
}

.card{
padding:35px 25px;
border-radius:24px;
}

h1{
font-size:2.2rem;
line-height:1.15;
}

.section{
margin-top:30px;
}

.section-title{
font-size:1.25rem;
margin-bottom:15px;
}

.content-box{
padding:20px;
border-radius:16px;
font-size:0.98rem;
line-height:1.8;
overflow-wrap:break-word;
}

.btn-kida{
width:100%;
text-align:center;
padding:16px 20px;
font-size:1rem;
}

}

@media(max-width:480px){

body{
padding:20px 12px;
}

.card{
padding:28px 20px;
border-radius:20px;
}

h1{
font-size:1.8rem;
}

p{
font-size:0.95rem !important;
line-height:1.7 !important;
}

.section-title{
font-size:1.1rem;
}

.content-box{
padding:18px;
font-size:0.93rem;
line-height:1.7;
}

.btn-kida{
margin-top:28px;
font-size:0.95rem;
padding:15px 18px;
}

}

</style>

</head>

<body>

<div class="card">

<div id="record">

Loading...

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyAoYu9k8QKVhTalNJgYgFwztmtKPN1mMio",
authDomain: "kida-835b0.firebaseapp.com",
projectId: "kida-835b0",
storageBucket: "kida-835b0.firebasestorage.app",
messagingSenderId: "886653080955",
appId: "1:886653080955:web:2de5128e099e4afd6f99de",
measurementId: "G-J020RVE5EK"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const params =
new URLSearchParams(window.location.search);

const id = params.get("id");

const record =
document.getElementById("record");

async function loadRecord(){

if(!id){

record.innerHTML = "No record ID found.";

return;

}

const docRef =
doc(db,"resources",id);

const docSnap =
await getDoc(docRef);

if(!docSnap.exists()){

record.innerHTML = "Record not found.";

return;

}

const data = docSnap.data();

record.innerHTML = `

<h1>

${data.tournament || "Untitled Tournament"}

</h1>

<p style="font-size:1.1rem;color:#4f6477;">

${data.format || ""}

${data.tournamentDate ? " • " + data.tournamentDate : ""}

</p>

<div class="section">

<div class="section-title">

Adjudication Core

</div>

<div class="content-box">

${
data.adjudicationCore ||
data.AdjudicationCore ||
"No adjudication core uploaded."
}

</div>

</div>

<div class="section">

<div class="section-title">

Breaks

</div>

<div class="content-box">

${
typeof (data.breaks || data.Breaks) === "string"

? (data.breaks || data.Breaks).replace(/\n/g,"<br>")

: Array.isArray(data.breaks || data.Breaks)

? (data.breaks || data.Breaks).join("<br><br>")

: typeof (data.breaks || data.Breaks) === "object"
&& (data.breaks || data.Breaks) !== null

? Object.values(data.breaks || data.Breaks).join("<br><br>")

: "No breaks uploaded."
}

</div>

</div>

<div class="section">

<div class="section-title">

Individual Awards

</div>

<div class="content-box">

${data.individualAwards || "No individual awards uploaded."}

</div>

</div>

${
data.link
? `
<a
href="${data.link}"
target="_blank"
class="btn-kida">

Open Tab / Results

</a>
`
: ""
}

`;

}

loadRecord();

</script>

</body>
</html>
