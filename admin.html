<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIDA Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
background:#f4f8fc;
font-family:'Inter',sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.admin-box{
background:white;
padding:60px;
border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,0.08);
width:100%;
max-width:500px;
}

h1{
font-weight:800;
color:#16324f;
margin-bottom:40px;
}

.form-control{
padding:16px;
border-radius:14px;
margin-bottom:20px;
}

.btn-kida{
background:#d62839;
border:none;
padding:16px;
width:100%;
border-radius:14px;
font-weight:700;
color:white;
transition:0.3s;
}

.btn-kida:hover{
background:#b71f2e;
}

</style>

</head>

<body>

<div class="admin-box">

<h1>
KIDA Admin Login
</h1>

<input
type="email"
id="email"
class="form-control"
placeholder="Admin Email">

<input
type="password"
id="password"
class="form-control"
placeholder="Password">

<button
class="btn-kida"
id="loginBtn">

Login

</button>

<p
id="status"
class="mt-4 text-danger fw-semibold">
</p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyAoYu9k8QKVhTalNJgYgFwztmtKPN1mMio",

authDomain: "kida-835b0.firebaseapp.com",

projectId: "kida-835b0",

storageBucket: "kida-835b0.firebasestorage.app",

messagingSenderId: "886653080955",

appId: "1:886653080955:web:2de5128e099e4afd6f99de",

measurementId: "G-J020RVE5EK"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async () => {

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

document.getElementById("status").innerText =
"Login successful.";

window.location.href = "dashboard.html";

}catch(error){

console.log(error);

document.getElementById("status").innerText =
error.message;

}

});

</script>

</body>
</html>
