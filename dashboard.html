<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KIDA Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
background:#f4f8fc;
font-family:'Inter',sans-serif;
padding:80px 20px;
}

.dashboard-card{
background:white;
padding:50px;
border-radius:30px;
box-shadow:0 15px 50px rgba(0,0,0,0.08);
max-width:1300px;
margin:auto;
}

h1{
font-weight:800;
color:#16324f;
font-size:3rem;
}

.section-title{
font-weight:800;
color:#16324f;
margin-bottom:30px;
font-size:2rem;
}

.form-control,
.form-select{
padding:16px;
border-radius:16px;
margin-bottom:20px;
border:1px solid #dbe5ef;
}

.form-control:focus,
.form-select:focus{
border-color:#1f5f97;
box-shadow:none;
}

.btn-kida{
background:#d62839;
border:none;
padding:16px 30px;
border-radius:16px;
font-weight:700;
color:white;
width:100%;
font-size:1.05rem;
transition:0.3s;
margin-top:10px;
}

.btn-kida:hover{
background:#b71f2e;
}

.resource-item{
background:#f8fbff;
padding:30px;
border-radius:24px;
margin-top:25px;
border:1px solid rgba(0,0,0,0.06);
}

.resource-item h3{
font-size:1.5rem;
font-weight:700;
color:#16324f;
margin-bottom:15px;
}

.resource-item p{
color:#4f6477;
line-height:1.8;
}

.action-buttons{
display:flex;
gap:15px;
margin-top:20px;
flex-wrap:wrap;
}

.edit-btn{
background:#1f5f97;
border:none;
padding:12px 24px;
border-radius:12px;
font-weight:700;
color:white;
text-decoration:none;
cursor:pointer;
}

.delete-btn{
background:#d62839;
border:none;
padding:12px 24px;
border-radius:12px;
font-weight:700;
color:white;
cursor:pointer;
}

.logout-btn{
background:#16324f;
border:none;
padding:14px 28px;
border-radius:14px;
font-weight:700;
color:white;
}

.tab-btn{
background:#eef4fb;
border:none;
padding:14px 26px;
border-radius:14px;
font-weight:700;
color:#16324f;
transition:0.3s;
}

.tab-btn:hover{
background:#dbe9f7;
}

.tab-btn.active{
background:#d62839;
color:white;
}

.dashboard-tab{
animation:fadeTab 0.3s ease;
}

.meta{
font-size:0.95rem;
margin-bottom:15px;
color:#16324f;
line-height:1.0;
white-space:pre-line;
}

@keyframes fadeTab{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:767px){

.hero{
padding:120px 0 80px;
}

.hero h1{
font-size:3rem !important;
}

.resource-card{
padding:25px;
}

.group-title{
font-size:1.7rem;
}

}

@media(max-width:768px){

body{
padding:40px 12px;
}

.dashboard-card{
padding:25px;
border-radius:22px;
}

h1{
font-size:2rem;
line-height:1.2;
}

.section-title{
font-size:1.5rem;
}

.resource-grid{
grid-template-columns:1fr;
}

.resource-filter-bar{
overflow-x:auto;
flex-wrap:nowrap;
padding-bottom:10px;
}

.resource-filter{
white-space:nowrap;
}

.action-buttons{
flex-direction:column;
}

.edit-btn,
.delete-btn{
width:100%;
text-align:center;
}

.tab-btn{
width:100%;
}

.form-control,
.form-select{
font-size:16px;
}

.modal-dialog{
margin:10px;
}

.modal-content{
border-radius:20px;
}

}

.resource-manager{
margin-top:30px;
}

.resource-filter-bar{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-bottom:35px;
}

.resource-filter{
background:#eef4fb;
border:none;
padding:12px 20px;
border-radius:14px;
font-weight:700;
color:#16324f;
transition:0.25s;
cursor:pointer;
}

.resource-filter:hover{
background:#dbe9f7;
}

.resource-filter.active{
background:#d62839;
color:white;
}

.resource-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:24px;
}

.resource-item{
background:white;
padding:28px;
border-radius:22px;
border:1px solid #e3ebf3;
margin-top:0;
transition:0.25s;
display:flex;
flex-direction:column;
justify-content:space-between;
min-height:240px;
}

.resource-item:hover{
transform:translateY(-4px);
box-shadow:0 12px 30px rgba(0,0,0,0.07);
}

.resource-item h3{
font-size:1.2rem;
margin-bottom:12px;
line-height:1.4;
}

.resource-item p{
font-size:0.96rem;
line-height:1.7;
margin-bottom:18px;
}

.meta{
font-size:0.9rem;
background:#f4f8fc;
padding:10px 14px;
border-radius:12px;
margin-bottom:18px;
}

</style>

</head>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

collection,

doc,

from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyAoYu9k8QKVhTalNJgYgFwztmtKPN1mMio",
authDomain: "kida-835b0.firebaseapp.com",
projectId: "kida-835b0",
storageBucket: "kida-835b0.firebasestorage.app",
messagingSenderId: "886653080955",
appId: "1:886653080955:web:2de5128e099e4afd6f99de"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

onAuthStateChanged(auth, (user)=>{

window.showTab = function(tabId, button){

document
.querySelectorAll(".dashboard-tab")
.forEach(tab=>{

tab.style.display = "none";

});

document
.getElementById(tabId)
.style.display = "block";

document
.querySelectorAll(".tab-btn")
.forEach(btn=>{

btn.classList.remove("active");

});

button.classList.add("active");

};

const categorySelect =
document.getElementById("category");

const financeWrapper =
document.getElementById("financeReportWrapper");

function toggleFinanceField(){

if(categorySelect.value === "tournament-bids"){

financeWrapper.style.display = "block";

}else{

financeWrapper.style.display = "none";

}

const kncWrapper =
document.getElementById("kncButtonWrapper");

if(categorySelect.value === "knc-archive"){

kncWrapper.style.display = "block";

}else{

kncWrapper.style.display = "none";

}

}

categorySelect.addEventListener(
"change",
toggleFinanceField
);

toggleFinanceField();

document
.getElementById("publishBtn")
.addEventListener("click", async ()=>{

await addDoc(collection(db,"resources"),{

title:
document.getElementById("title").value,

description:
document.getElementById("description").value,

group:
document.getElementById("group").value,

link:
document.getElementById("link").value,

noTab:
document.getElementById("noTabCheckbox").checked,

financeReport:
document.getElementById("financeReport").value,

category:
document.getElementById("category").value,

createdAt: serverTimestamp()

});

alert("Resource Published");

loadResources();

});

document
.getElementById("publishAchievementBtn")
.addEventListener("click", async ()=>{

await addDoc(collection(db,"resources"),{

category:"achievements",

title:
document.getElementById("achievementTournament").value,

tournament:
document.getElementById("achievementTournament").value,

tournamentTag:
document.getElementById("achievementTournamentTag").value,

tournamentDate:
document.getElementById("achievementDate").value,

format:
document.getElementById("achievementFormat").value,

adjudicationCore:
document.getElementById("achievementCore").value,

breaks:
document.getElementById("achievementBreaks").value,

individualAwards:
document.getElementById("achievementIndividualAwards").value,

institution:
document.getElementById("achievementInstitution").value,

document
.getElementById("achievementInstitution")
.value
.split(",")
.map(inst => inst.trim())
.filter(inst => inst !== ""),

document.getElementById("achievementYear").value,

document.getElementById("achievementYear").value,

`${document.getElementById("achievementFormat").value} • ${document.getElementById("achievementDate").value}`,

});

});

document
.getElementById("publishTournamentBtn")
.addEventListener("click", async ()=>{

await addDoc(collection(db,"tournaments"),{

title:
document.getElementById("tournamentTitle").value,

description:
document.getElementById("tournamentDescription").value,

link:
document.getElementById("tournamentLink").value,

createdAt: serverTimestamp()

});

alert("Tournament Published");

document
.getElementById("publishUniversityBtn")
.addEventListener("click", async ()=>{

await addDoc(collection(db,"universities"),{

name:
document.getElementById("universityName").value,

subtitle:
document.getElementById("universitySubtitle").value,

description:
document.getElementById("universityDescription").value,

image:
document.getElementById("universityImage").value,

instagram:
document.getElementById("universityInstagram").value,

instagramHandle:
document.getElementById("universityInstagramHandle").value,

createdAt: serverTimestamp()

});

alert("University Published");

async function loadResources(filter = "all"){

const list =
document.getElementById("resourceList");

list.innerHTML = "";

const snapshot =
await getDocs(collection(db,"resources"));

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

if(data.category === "achievements") return;

if(
filter !== "all" &&
data.category !== filter &&
!(filter === "knc-archive" && data.category === "international-resources")
) return;

list.innerHTML += `

<div class="resource-item">

<div>

<h3>${data.title || "-"}</h3>

<p>${data.description || "-"}</p>

<div class="meta">
${data.group || "General"}
</div>

</div>

<div class="action-buttons">

<button
class="edit-btn"
onclick="openEditor('${docSnap.id}','resources')">

Edit

</button>

<button
class="delete-btn"
onclick="deleteResource('${docSnap.id}','resources')">

Delete

</button>

</div>

</div>

`;

});

}

async function loadAchievements(){

const list =
document.getElementById("achievementList");

const filterSelect =
document.getElementById("achievementTournamentFilter");

const searchInput =
document.getElementById("achievementSearch");

list.innerHTML = "";

const snapshot =
await getDocs(collection(db,"resources"));

const tournamentTags = new Set();
const years = new Set();

const achievements = [];

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

if(data.category !== "achievements") return;

achievements.push({
id: docSnap.id,
data
});

if(data.tournamentTag){
tournamentTags.add(data.tournamentTag);
}

if(data.year){
years.add(data.year);
}

});

/* TOURNAMENT TAG FILTER */

filterSelect.innerHTML = `
<option value="all">
All Tournament Tags
</option>
`;

[...tournamentTags]
.sort()
.forEach(tag=>{

filterSelect.innerHTML += `
<option value="${tag}">
${tag}
</option>
`;

});

/* YEAR FILTER */

const yearFilter =
document.getElementById("achievementYearFilter");

yearFilter.innerHTML = `
<option value="all">
All Years
</option>
`;

[...years]
.sort((a,b)=>b-a)
.forEach(year=>{

yearFilter.innerHTML += `
<option value="${year}">
${year}
</option>
`;

});

function renderAchievements(){

list.innerHTML = "";

const selectedTournamentTag =
filterSelect.value;

const selectedYear =
document.getElementById("achievementYearFilter").value;

const searchTerm =
searchInput.value.toLowerCase();

achievements.forEach(({id,data})=>{

if(
selectedTournamentTag !== "all" &&
data.tournamentTag !== selectedTournamentTag
){
return;
}

if(
selectedYear !== "all" &&
data.year !== selectedYear
){
return;
}

if(
searchTerm &&
!data.tournament.toLowerCase().includes(searchTerm)
){
return;
}

list.innerHTML += `

<div class="resource-item">

<h3>${data.tournament || "-"}</h3>

<div class="meta">

<div><b>Date:</b> ${data.tournamentDate || "-"}</div>

<div><b>Format:</b> ${data.format || "-"}</div>

<div><b>Institution:</b> ${data.institution || "-"}</div>

<div><b>Year:</b> ${data.year || "-"}</div>

</div>

<p>${data.description || "-"}</p>

${
data.breaks
? `
<div class="meta">
<b>Breaks:</b>

${data.breaks}
</div>
`
: ""
}

<div class="action-buttons">

<a
href="achievement-detail.html?id=${id}"
class="edit-btn">

Open Record

</a>

<button
class="edit-btn"
onclick="openEditor('${id}','resources')">

Edit

</button>

<button
class="delete-btn"
onclick="deleteResource('${id}','resources')">

Delete

</button>

</div>

</div>

`;

});

}

filterSelect.onchange = renderAchievements;

document
.getElementById("achievementYearFilter")
.onchange = renderAchievements;

searchInput.oninput = renderAchievements;

renderAchievements();

}

`;

window.deleteResource = async function(id, collectionName){

if(!confirm("Delete item?")) return;

await deleteDoc(doc(db,collectionName,id));

loadResources();
loadAchievements();
loadTournaments();
loadUniversities();

};

document.addEventListener("click", (e)=>{

if(e.target.classList.contains("resource-filter")){

document
.querySelectorAll(".resource-filter")
.forEach(btn=>{

btn.classList.remove("active");

});

e.target.classList.add("active");

const category =
e.target.dataset.category;

loadResources(category);

}

});

window.openEditor = async function(id, collectionName){

const docRef =
doc(db, collectionName, id);

const snap =
await getDoc(docRef);

if(!snap.exists()) return;

const data = snap.data();

document.getElementById("editDocId").value = id;

document.getElementById("editCollection").value = collectionName;

/* HIDE ALL EDITORS */

document.getElementById("resourceEditor").style.display = "none";
document.getElementById("achievementEditor").style.display = "none";
document.getElementById("tournamentEditor").style.display = "none";
document.getElementById("universityEditor").style.display = "none";

/* RESOURCES */

if(
collectionName === "resources" &&
data.category !== "achievements"
){

document.getElementById("resourceEditor").style.display = "block";

document.getElementById("editResourceTitle").value =
data.title || "";

document.getElementById("editResourceDescription").value =
data.description || "";

document.getElementById("editResourceLink").value =
data.link || "";

document.getElementById("editFinanceReport").value =
data.financeReport || "";

const financeEditWrapper =
document.getElementById("editFinanceWrapper");

if(data.category === "tournament-bids"){

financeEditWrapper.style.display = "block";

}else{

financeEditWrapper.style.display = "none";

}

document.getElementById("editResourceGroup").value =
data.group || "";

}

/* ACHIEVEMENTS */

if(
collectionName === "resources" &&
data.category === "achievements"
){

document.getElementById("achievementEditor").style.display = "block";

document.getElementById("editAchievementTitle").value =
data.tournament || "";

document.getElementById("editAchievementTag").value =
data.tournamentTag || "";

document.getElementById("editAchievementDate").value =
data.tournamentDate || "";

document.getElementById("editAchievementFormat").value =
data.format || "";

document.getElementById("editAchievementInstitution").value =
data.institution || "";

document.getElementById("editAchievementBreaks").value =
data.breaks || "";

document.getElementById("editAchievementCore").value =
data.adjudicationCore || "";

document.getElementById("editAchievementAwards").value =
data.individualAwards || "";

document.getElementById("editAchievementLink").value =
data.link || "";

}

/* TOURNAMENTS */

if(collectionName === "tournaments"){

document.getElementById("tournamentEditor").style.display = "block";

document.getElementById("editTournamentTitle").value =
data.title || "";

document.getElementById("editTournamentDescription").value =
data.description || "";

document.getElementById("editTournamentLink").value =
data.link || "";

}

/* UNIVERSITIES */

if(collectionName === "universities"){

document.getElementById("universityEditor").style.display = "block";

document.getElementById("editUniversityName").value =
data.name || "";

document.getElementById("editUniversitySubtitle").value =
data.subtitle || "";

document.getElementById("editUniversityDescription").value =
data.description || "";

document.getElementById("editUniversityImage").value =
data.image || "";

document.getElementById("editUniversityInstagram").value =
data.instagram || "";

document.getElementById("editUniversityInstagramHandle").value =
data.instagramHandle || "";

}

const modal =
new bootstrap.Modal(
document.getElementById("editModal")
);

modal.show();

};
